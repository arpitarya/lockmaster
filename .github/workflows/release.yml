# lockmaster's own release pipeline — SR-ARCHITECTURE decision 17.
# Not part of kit/: it publishes lockmaster, and `lockmaster install` never
# copies it into another repository.
#
#   push a tag v<version>  ->  test · lint · build · verify the wheel on every OS
#                          ->  TestPyPI  ->  PyPI (the `pypi` environment's reviewer approves)
#                          ->  a GitHub release with the files and the CHANGELOG section
#   run it by hand         ->  everything up to and including verify; publishes nothing
#
# Publishing uses PyPI trusted publishing (OIDC): no token is stored anywhere.
# One-time setup, on the decider's accounts: CONTRIBUTING.md §Releasing.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: unit tests (scratch git repositories)
        run: python -m unittest discover tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: work-system checks
        run: python scripts/check-work-system.py
      - name: inbox shape
        run: python scripts/check-open-work-inbox.py
      - name: no forced git operation in the tool (SR-LAW-3)
        run: "! grep -rnE -- '--force|branch -D|reset --hard|git clean|push -f' src kit/claude"

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: the tag, __version__ and CHANGELOG agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/release.py check "$GITHUB_REF_NAME"
      - name: build the sdist and the wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: metadata renders on PyPI
        run: python -m twine check --strict dist/*
      - name: the wheel carries the kit
        run: |
          missing=0
          for f in $(cd kit && find . -type f ! -name .DS_Store | sed 's|^\./||'); do
            unzip -l dist/*.whl | grep -q "lockmaster/kit/$f\$" || { echo "missing from the wheel: kit/$f"; missing=1; }
          done
          exit $missing
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: install the wheel, nothing else
        run: python -m pip install dist/*.whl
      - name: the installed command works
        run: |
          lockmaster --version
          python -m lockmaster --help > /dev/null
      - name: install the kit into a scratch repository from the wheel, and doctor it
        run: |
          mkdir scratch && cd scratch
          git init -q -b main
          git config user.name ci && git config user.email ci@example.com
          echo a > a.txt && git add a.txt && git commit -q -m init
          lockmaster install .
          test -f .claude/hooks/block-main.py
          test -f .claude/lockmaster.lock
          lockmaster doctor
      - name: land one change from the wheel
        run: |
          cd scratch
          lockmaster start W-1 --paths a.txt
          echo b > .claude/worktrees/W-1/a.txt
          (cd .claude/worktrees/W-1 && lockmaster submit -m "W-1: smoke")
          test "$(git log -1 --format='%(trailers:key=Lockmaster-Change,valueonly)' main | head -1)" = "W-1"
          test "$(cat a.txt)" = "b"

  publish-testpypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lockmaster
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lockmaster
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: the GitHub release, with the CHANGELOG section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes "$GITHUB_REF_NAME" > notes.md
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*a[0-9]*|*b[0-9]*|*rc[0-9]*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "lockmaster ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md --verify-tag $prerelease
