[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lockmaster"
dynamic = ["version"]           # one source: lockmaster.__version__ (src/lockmaster/__init__.py)
description = "Lands AI-agent changes into main one at a time, without ever losing work."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arpit Arya" }]
requires-python = ">=3.9"
dependencies = []               # SR-LAW-4: the standard library alone
keywords = ["git", "merge-queue", "ai-agents", "worktree", "claude-code"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/arpitarya/lockmaster"
Changelog = "https://github.com/arpitarya/lockmaster/blob/main/CHANGELOG.md"
Issues = "https://github.com/arpitarya/lockmaster/issues"

[project.scripts]
lockmaster = "lockmaster.cli:main"

[tool.setuptools]
# kit/ ships inside the package as lockmaster/kit, so `lockmaster install`
# works from a pip install (SR-ARCHITECTURE decision 15).
package-dir = { "" = "src", "lockmaster.kit" = "kit" }
# Every kit/ directory is listed; tests/test_packaging.py fails when one is not.
packages = [
  "lockmaster",
  "lockmaster.kit",
  "lockmaster.kit.claude",
  "lockmaster.kit.claude.hooks",
  "lockmaster.kit.claude.skills",
  "lockmaster.kit.claude.skills.docket",
]

[tool.setuptools.package-data]
"lockmaster.kit" = ["*"]
"lockmaster.kit.claude" = ["*"]
"lockmaster.kit.claude.hooks" = ["*"]
"lockmaster.kit.claude.skills" = ["*"]
"lockmaster.kit.claude.skills.docket" = ["*"]

[tool.setuptools.exclude-package-data]
"*" = [".DS_Store", "*.pyc"]

[tool.setuptools.dynamic]
version = { attr = "lockmaster.__version__" }
